name: glowe
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Architecture
  flutter_riverpod: ^2.5.1

  # Database, Functions & Auth (Firebase)
  firebase_core: ^3.1.1
  cloud_firestore: ^5.0.1
  firebase_auth: ^5.1.1
  cloud_functions: ^5.0.1

  # Hardware Features (Camera & Scanning)
  camera: ^0.11.0
  image_picker: ^1.1.2
  mobile_scanner: ^5.1.1
  google_mlkit_text_recognition: ^0.13.0

  # Networking
  http: ^1.2.1
  mailer: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/robot_logo.png
    - assets/flower_pattern.png